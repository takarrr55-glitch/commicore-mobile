plugins {
    id 'com.android.application'
}

android {
    namespace 'com.commicore.mobile'
    compileSdk 35

    defaultConfig {
        applicationId "com.commicore.mobile"
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName "0.3"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
